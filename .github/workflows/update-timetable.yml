name: Update bus timetable

# Every Monday at 04:17 (UTC), and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Download Envibus timetables and rebuild data/timetable.json
        run: python3 scripts/update_timetable.py

      - name: Save the new timetable if it changed
        run: |
          if git diff --quiet -- data/timetable.json; then
            echo "Timetable unchanged."
          else
            git config user.name "timetable-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/timetable.json
            git commit -m "Update bus timetable from Envibus"
            git push
          fi
